<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>CyberESP32LoRa · Docs</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        /* ===== HACKER THEME — PURE BLACK & WHITE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --bg-card: #0a0a0a;
            --bg-modal: rgba(0, 0, 0, 0.97);
            --border: #222222;
            --border-active: #ffffff;
            --text: #ffffff;
            --text-dim: #888888;
            --text-muted: #555555;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            --radius: 0.6rem;
            --radius-lg: 1.2rem;
            --font: 'Courier New', 'Fira Code', monospace;
            --transition: 0.2s ease;
        }

        html {
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.5;
        }

        /* ===== APP CONTAINER ===== */
        .app {
            max-width: 1100px;
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1rem 0.8rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.2rem;
        }

        .brand h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.03);
            line-height: 1.2;
        }

        .brand .sub {
            font-size: 0.6rem;
            color: var(--text-dim);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.2rem 0.5rem;
            letter-spacing: 0.2px;
        }

        .brand .sub a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px dashed var(--border);
            transition: var(--transition);
        }

        .brand .sub a:hover {
            color: var(--text-dim);
            border-bottom-color: var(--text-dim);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.65rem;
            color: var(--text-muted);
            flex-wrap: wrap;
            letter-spacing: 0.2px;
        }

        .stats span {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            white-space: nowrap;
        }

        .stats .num {
            color: var(--text);
            font-weight: 600;
        }

        .stats .gh-link {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px dotted var(--border);
            transition: var(--transition);
        }

        .stats .gh-link:hover {
            color: var(--text-dim);
            border-bottom-color: var(--text-dim);
        }

        /* ===== SEARCH ===== */
        .search-wrap {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
        }

        .search-wrap input {
            flex: 1;
            min-width: 0;
            padding: 0.5rem 0.8rem;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.8rem;
            font-family: var(--font);
            outline: none;
            transition: var(--transition);
        }

        .search-wrap input::placeholder {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .search-wrap input:focus {
            border-color: var(--text);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .search-wrap button {
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .search-wrap button:hover {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .search-wrap button:active {
            transform: scale(0.96);
        }

        /* ===== FILE GRID ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .file-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem 0.6rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: var(--text-dim);
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font);
        }

        .file-card:hover {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .file-card:active {
            transform: scale(0.97);
        }

        .file-card .icon {
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .file-card .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-card .badge {
            font-size: 0.45rem;
            background: var(--border);
            color: var(--text);
            padding: 0.05rem 0.4rem;
            border-radius: 20px;
            font-weight: 400;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .file-card .badge.readme {
            background: var(--text);
            color: var(--bg);
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem 1.5rem;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: var(--font);
            letter-spacing: 0.2px;
        }

        .footer a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px dotted var(--border);
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--text-dim);
            border-bottom-color: var(--text-dim);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-modal);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            max-width: 820px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
            opacity: 0;
            overflow: hidden;
        }

        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 0.8rem;
        }

        .modal-header .title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text);
            min-width: 0;
            font-family: var(--font);
        }

        .modal-header .title .icon {
            font-size: 1rem;
            flex-shrink: 0;
        }

        .modal-header .title .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-header .actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .modal-header .actions a {
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-size: 0.6rem;
            border: 1px solid var(--border);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-family: var(--font);
        }

        .modal-header .actions a:hover {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 0.2rem;
            line-height: 1;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            font-family: var(--font);
        }

        .modal-close:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.2rem 1.2rem;
            overflow-y: auto;
            flex: 1;
            min-height: 150px;
            max-height: 70vh;
            scroll-behavior: smooth;
        }

        .modal-body::-webkit-scrollbar {
            width: 4px;
        }

        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .modal-body::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* ===== MARKDOWN STYLES INSIDE MODAL ===== */
        .modal-body .md-content {
            font-family: var(--font);
            color: var(--text);
            font-size: 0.8rem;
            animation: fadeSlide 0.25s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-body .md-content h1,
        .modal-body .md-content h2,
        .modal-body .md-content h3,
        .modal-body .md-content h4,
        .modal-body .md-content h5 {
            color: var(--text);
            margin-top: 1.2rem;
            margin-bottom: 0.4rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .modal-body .md-content h1 {
            font-size: 1.4rem;
            border-left: 3px solid var(--text);
            padding-left: 0.8rem;
        }

        .modal-body .md-content h2 {
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.2rem;
        }

        .modal-body .md-content h3 {
            font-size: 0.95rem;
        }

        .modal-body .md-content p {
            line-height: 1.6;
            color: var(--text-dim);
            margin: 0.6rem 0;
        }

        .modal-body .md-content ul,
        .modal-body .md-content ol {
            padding-left: 1.2rem;
            color: var(--text-dim);
            margin: 0.4rem 0;
        }

        .modal-body .md-content li {
            margin: 0.15rem 0;
        }

        .modal-body .md-content a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px dotted var(--border);
            transition: var(--transition);
        }

        .modal-body .md-content a:hover {
            color: var(--text-dim);
            border-bottom-color: var(--text-dim);
        }

        .modal-body .md-content code {
            background: var(--bg);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .modal-body .md-content pre {
            background: var(--bg);
            padding: 0.8rem 1rem;
            border-radius: var(--radius);
            overflow-x: auto;
            border: 1px solid var(--border);
            margin: 0.8rem 0;
        }

        .modal-body .md-content pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-dim);
            font-size: 0.7rem;
        }

        .modal-body .md-content blockquote {
            border-left: 3px solid var(--text);
            padding-left: 0.8rem;
            margin: 0.8rem 0;
            color: var(--text-dim);
            font-style: italic;
        }

        .modal-body .md-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.2rem 0;
        }

        .modal-body .md-content img {
            max-width: 100%;
            border-radius: var(--radius);
            margin: 0.4rem 0;
            border: 1px solid var(--border);
        }

        .modal-body .md-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.8rem 0;
            font-size: 0.75rem;
        }

        .modal-body .md-content table th,
        .modal-body .md-content table td {
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            text-align: left;
        }

        .modal-body .md-content table th {
            background: var(--bg);
            color: var(--text);
        }

        .modal-body .md-content .error-state {
            text-align: center;
            padding: 1.5rem 0.5rem;
            color: var(--text-dim);
        }

        .modal-body .md-content .error-state .big {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.4rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            html {
                font-size: 13px;
            }

            .app {
                padding: 0.8rem 0.5rem;
                border-radius: 1rem;
            }

            .brand h1 {
                font-size: 1rem;
            }
            .brand .sub {
                font-size: 0.55rem;
            }
            .stats {
                font-size: 0.55rem;
                gap: 0.5rem;
            }
            .search-wrap input {
                font-size: 0.7rem;
                padding: 0.4rem 0.6rem;
            }
            .search-wrap button {
                font-size: 0.6rem;
                padding: 0.4rem 0.8rem;
            }
            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 0.4rem;
            }
            .file-card {
                font-size: 0.6rem;
                padding: 0.4rem 0.5rem;
                border-radius: 0.4rem;
            }
            .file-card .icon {
                font-size: 0.7rem;
            }
            .footer {
                font-size: 0.5rem;
                gap: 0.3rem 0.8rem;
                padding-top: 0.6rem;
                margin-top: 0.8rem;
            }

            .modal {
                max-height: 96vh;
                border-radius: 1rem;
            }
            .modal-header {
                padding: 0.6rem 0.8rem;
            }
            .modal-header .title {
                font-size: 0.7rem;
            }
            .modal-header .title .icon {
                font-size: 0.8rem;
            }
            .modal-header .actions a {
                font-size: 0.5rem;
                padding: 0.15rem 0.4rem;
            }
            .modal-close {
                font-size: 1rem;
                width: 1.6rem;
                height: 1.6rem;
            }
            .modal-body {
                padding: 0.8rem 0.8rem;
                max-height: 65vh;
            }
            .modal-body .md-content {
                font-size: 0.7rem;
            }
            .modal-body .md-content h1 {
                font-size: 1.1rem;
                padding-left: 0.6rem;
            }
            .modal-body .md-content h2 {
                font-size: 0.9rem;
            }
            .modal-body .md-content h3 {
                font-size: 0.8rem;
            }
            .modal-body .md-content pre {
                padding: 0.5rem 0.6rem;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 400px) {
            .file-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.3rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
            }
            .search-wrap {
                flex-wrap: wrap;
            }
            .search-wrap button {
                width: 100%;
                justify-content: center;
            }
        }

        /* ===== UTILITY ===== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        /* empty state for grid */
        .empty-grid {
            grid-column: 1 / -1;
            text-align: center;
            padding: 1.5rem 0.5rem;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .empty-grid strong {
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <h1>⚡ CyberESP32LoRa</h1>
                <div class="sub">
                    <span>ESP32 · LoRa · Wi‑Fi · BLE</span>
                    <span>—</span>
                    <a href="https://github.com/HumayunShariarHimu" target="_blank">Humayun Shariar Himu</a>
                </div>
            </div>
            <div class="stats">
                <span>📄 <span class="num" id="fileCount">0</span></span>
                <span><a href="https://github.com/HumayunShariarHimu/CyberESP32LoRa" target="_blank" class="gh-link">GitHub →</a></span>
            </div>
        </header>

        <!-- SEARCH -->
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="🔍 search files & content..." aria-label="Search documents" />
            <button id="searchBtn">search</button>
        </div>

        <!-- FILE GRID -->
        <div class="file-grid" id="fileGrid" role="list" aria-label="Document list"></div>

        <!-- FOOTER -->
        <footer class="footer">
            <span>⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯</span>
            <span><a href="https://github.com/HumayunShariarHimu/CyberESP32LoRa" target="_blank">repository</a></span>
            <span><a href="https://marked.js.org/" target="_blank">marked.js</a></span>
            <span>⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯</span>
        </footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <div class="title" id="modalTitle">
                    <span class="icon" id="modalIcon">📄</span>
                    <span class="name" id="modalFileName">document</span>
                </div>
                <div class="actions">
                    <a href="#" id="modalRawLink" target="_blank" rel="noopener">raw</a>
                    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="md-content" id="modalContent">
                    <p style="color:var(--text-muted);text-align:center;padding:1.5rem 0;">loading…</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const REPO_OWNER = 'HumayunShariarHimu';
            const REPO_NAME = 'CyberESP32LoRa';
            const BRANCH = 'main';

            // DOM
            const grid = document.getElementById('fileGrid');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const fileCountSpan = document.getElementById('fileCount');

            const overlay = document.getElementById('modalOverlay');
            const modalBody = document.getElementById('modalBody');
            const modalContent = document.getElementById('modalContent');
            const modalFileName = document.getElementById('modalFileName');
            const modalIcon = document.getElementById('modalIcon');
            const modalRawLink = document.getElementById('modalRawLink');
            const modalClose = document.getElementById('modalClose');

            let allDocs = [];
            let isModalOpen = false;

            // ----- API -----
            async function fetchAllMarkdownFiles() {
                const url =
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`API error: ${resp.status}`);
                const data = await resp.json();
                const mdFiles = data.tree.filter(item =>
                    item.type === 'blob' && item.path.endsWith('.md')
                );
                return mdFiles.map(item => ({
                    name: item.path.split('/').pop(),
                    path: item.path,
                    url: `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${item.path}`
                }));
            }

            async function fetchContent(fileInfo) {
                try {
                    const resp = await fetch(fileInfo.url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const content = await resp.text();
                    return { ...fileInfo, content, error: false };
                } catch (err) {
                    return {
                        ...fileInfo,
                        content: `⚠️ Failed to load: ${err.message}`,
                        error: true
                    };
                }
            }

            async function loadAllDocs() {
                try {
                    const fileInfos = await fetchAllMarkdownFiles();
                    if (fileInfos.length === 0) throw new Error('No .md files found');
                    const promises = fileInfos.map(info => fetchContent(info));
                    return await Promise.all(promises);
                } catch (err) {
                    console.error('Load error:', err);
                    throw err;
                }
            }

            // ----- RENDER GRID -----
            function renderGrid(docs) {
                grid.innerHTML = '';
                if (!docs || docs.length === 0) {
                    grid.innerHTML = `<div class="empty-grid">🔍 no documents match</div>`;
                    fileCountSpan.textContent = '0';
                    return;
                }
                docs.forEach((doc) => {
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.setAttribute('role', 'listitem');
                    const isReadme = doc.name === 'README.md';
                    const icon = isReadme ? '📖' : '📄';
                    const label = doc.name.replace(/\.md$/, '');
                    const badgeClass = isReadme ? 'badge readme' : 'badge';
                    const badgeText = isReadme ? 'README' : 'MD';
                    card.innerHTML = `
                        <span class="icon">${icon}</span>
                        <span class="name">${label}</span>
                        <span class="${badgeClass}">${badgeText}</span>
                    `;
                    card.addEventListener('click', () => openModal(doc));
                    // touch support
                    card.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        openModal(doc);
                    });
                    grid.appendChild(card);
                });
                fileCountSpan.textContent = docs.length;
            }

            // ----- MODAL -----
            function openModal(doc) {
                const isReadme = doc.name === 'README.md';
                modalIcon.textContent = isReadme ? '📖' : '📄';
                modalFileName.textContent = doc.name.replace(/\.md$/, '');
                modalRawLink.href = doc.url;

                if (doc.error) {
                    modalContent.innerHTML = `
                        <div class="error-state">
                            <span class="big">⚠️</span>
                            <p>${doc.content}</p>
                            <p style="font-size:0.7rem;color:var(--text-muted);margin-top:0.4rem;">
                                <a href="${doc.url}" target="_blank" style="color:var(--text);">view on GitHub →</a>
                            </p>
                        </div>
                    `;
                } else {
                    try {
                        const html = marked.parse(doc.content);
                        modalContent.innerHTML = html;
                    } catch (e) {
                        modalContent.innerHTML = `
                            <div class="error-state">
                                <span class="big">⚠️</span>
                                <p>Markdown rendering error: ${e.message}</p>
                            </div>
                        `;
                    }
                }

                overlay.classList.add('open');
                isModalOpen = true;
                document.body.style.overflow = 'hidden';
                setTimeout(() => modalClose.focus(), 100);
            }

            function closeModal() {
                overlay.classList.remove('open');
                isModalOpen = false;
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isModalOpen) closeModal();
            });

            // ----- SEARCH -----
            function performSearch(query) {
                if (!query.trim()) {
                    renderGrid(allDocs);
                    return;
                }
                const q = query.trim().toLowerCase();
                const filtered = allDocs.filter(doc =>
                    doc.name.toLowerCase().includes(q) ||
                    (doc.content && doc.content.toLowerCase().includes(q))
                );
                renderGrid(filtered);
            }

            searchBtn.addEventListener('click', () => performSearch(searchInput.value));
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performSearch(searchInput.value);
            });

            // ----- INIT -----
            async function init() {
                try {
                    allDocs = await loadAllDocs();
                    renderGrid(allDocs);
                } catch (err) {
                    grid.innerHTML = `
                        <div class="empty-grid" style="color:#ff6666;">
                            <span style="font-size:1.2rem;display:block;">⚠️</span>
                            <p>Failed to load repository data</p>
                            <p style="font-size:0.65rem;color:var(--text-muted);">${err.message}</p>
                            <p style="margin-top:0.6rem;">
                                <a href="https://github.com/${REPO_OWNER}/${REPO_NAME}" target="_blank" style="color:var(--text);">open on GitHub →</a>
                            </p>
                        </div>
                    `;
                }
            }

            init();
        })();
    </script>

</body>
</html>
