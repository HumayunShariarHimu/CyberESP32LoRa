<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>CyberESP32LoRa</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg:#000; --card:#0a0a0a; --panel:#050505; --border:#252525;
      --text:#fff; --dim:#aaa; --muted:#666; --radius:12px;
      --font:"Courier New", "Fira Code", monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { font-size:15px; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
    body {
      min-height:100vh; padding:clamp(8px,2vw,20px); background:var(--bg);
      color:var(--text); font-family:var(--font); line-height:1.5;
    }
    button,input { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    a { color:var(--text); }
    button:focus-visible,a:focus-visible,input:focus-visible,.file-card:focus-visible {
      outline:2px solid #fff; outline-offset:3px;
    }
    .app {
      width:min(1100px,100%); margin:0 auto; padding:clamp(12px,2.4vw,24px);
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:0 20px 60px #000;
    }
    .header {
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
      gap:12px; padding-bottom:16px; margin-bottom:20px; border-bottom:1px solid var(--border);
    }
    .brand { min-width:0; }
    .brand h1 { font-size:clamp(1.05rem,2.5vw,1.35rem); line-height:1.25; letter-spacing:-.5px; overflow-wrap:anywhere; }
    .sub { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin-top:5px; color:var(--dim); font-size:.68rem; }
    .sub a,.gh-link,.footer a { text-decoration:none; border-bottom:1px dotted var(--border); }
    .sub a:hover,.gh-link:hover,.footer a:hover { border-color:#fff; }
    .stats { display:flex; align-items:center; flex-wrap:wrap; gap:12px; color:var(--muted); font-size:.72rem; }
    .num { color:#fff; font-weight:bold; }
    .search-wrap { display:flex; gap:8px; margin-bottom:18px; }
    .search-wrap input {
      width:100%; min-width:0; padding:12px 15px; border:1px solid var(--border);
      border-radius:999px; background:#000; color:#fff; outline:none;
    }
    .search-wrap input::placeholder { color:var(--muted); }
    .search-wrap input:focus { border-color:#fff; }
    .search-wrap button,.secondary-btn {
      flex:0 0 auto; min-height:42px; padding:10px 18px; border:1px solid var(--border);
      border-radius:999px; background:#000; color:#fff; cursor:pointer;
      transition:background .18s,color .18s,border-color .18s;
    }
    .search-wrap button:hover,.secondary-btn:hover { background:#fff; color:#000; border-color:#fff; }
    .file-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));
      gap:9px; margin-bottom:18px;
    }
    .file-card {
      display:flex; align-items:center; gap:9px; min-width:0; min-height:48px;
      padding:10px 12px; border:1px solid var(--border); border-radius:9px;
      background:#000; color:var(--dim); cursor:pointer; user-select:none;
      transition:background .18s,color .18s,border-color .18s;
    }
    .file-card:hover,.file-card:focus-visible { background:#fff; color:#000; border-color:#fff; }
    .file-card .doc-mark { flex:0 0 auto; font-size:.75rem; font-weight:bold; }
    .file-card .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.78rem; }
    .badge { flex:0 0 auto; padding:2px 6px; border-radius:20px; background:#222; color:#fff; font-size:.56rem; }
    .badge.readme { background:#fff; color:#000; }
    .empty-grid { grid-column:1/-1; padding:28px 12px; text-align:center; color:var(--muted); overflow-wrap:anywhere; }
    .empty-grid strong { color:#fff; }
    .status { min-height:1.3em; margin:-8px 0 14px; color:var(--muted); font-size:.7rem; }
    .footer {
      display:flex; justify-content:center; flex-wrap:wrap; gap:8px 22px;
      margin-top:20px; padding-top:14px; border-top:1px solid var(--border);
      color:var(--muted); font-size:.68rem; text-align:center;
    }
    .footer .rule { color:#555; letter-spacing:2px; }
    .modal-overlay {
      position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
      padding:clamp(8px,2vw,22px); background:rgba(0,0,0,.97); backdrop-filter:blur(8px);
      opacity:0; visibility:hidden; transition:opacity .2s,visibility .2s;
    }
    .modal-overlay.open { opacity:1; visibility:visible; }
    .modal {
      display:flex; flex-direction:column; width:min(820px,100%); max-height: min(92dvh,900px);
      overflow:hidden; border:1px solid var(--border); border-radius:16px; background:var(--card);
      transform:translateY(8px) scale(.99); transition:transform .2s;
    }
    .modal-overlay.open .modal { transform:translateY(0) scale(1); }
    .modal-header {
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; border-bottom:1px solid var(--border);
    }
    .modal-title { display:flex; align-items:center; gap:9px; min-width:0; font-size:.86rem; font-weight:bold; }
    .modal-title .doc-mark { flex:0 0 auto; }
    .modal-title .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .actions { display:flex; align-items:center; gap:7px; flex:0 0 auto; }
    .actions a { padding:6px 10px; border:1px solid var(--border); border-radius:999px; text-decoration:none; color:var(--dim); font-size:.68rem; }
    .actions a:hover { background:#fff; color:#000; }
    .modal-close { width:36px; height:36px; border:1px solid transparent; border-radius:50%; background:transparent; color:#fff; cursor:pointer; font-size:1.1rem; }
    .modal-close:hover { border-color:var(--border); background:#171717; }
    .modal-body { flex:1; min-height:120px; overflow:auto; overscroll-behavior:contain; padding:clamp(14px,3vw,24px); }
    .md-content { font-size:.86rem; overflow-wrap:anywhere; }
    .md-content h1,.md-content h2,.md-content h3,.md-content h4,.md-content h5 { margin:1.25em 0 .5em; color:#fff; line-height:1.3; }
    .md-content h1 { margin-top:0; padding-left:12px; border-left:3px solid #fff; font-size:1.55rem; }
    .md-content h2 { padding-bottom:5px; border-bottom:1px solid var(--border); font-size:1.25rem; }
    .md-content h3 { font-size:1.08rem; }
    .md-content p { margin:.7em 0; color:#ccc; line-height:1.75; }
    .md-content ul,.md-content ol { margin:.6em 0; padding-left:1.5em; color:#ccc; }
    .md-content li { margin:.3em 0; }
    .md-content a { overflow-wrap:anywhere; text-decoration:none; border-bottom:1px dotted #555; }
    .md-content a:hover { border-color:#fff; }
    .md-content code { padding:2px 5px; border:1px solid var(--border); border-radius:4px; background:#000; color:#fff; font-size:.9em; }
    .md-content pre { max-width:100%; margin:1em 0; padding:14px; overflow:auto; border:1px solid var(--border); border-radius:9px; background:#000; }
    .md-content pre code { padding:0; border:0; color:#ddd; }
    .md-content blockquote { margin:1em 0; padding-left:14px; border-left:3px solid #fff; color:#bbb; }
    .md-content hr { margin:1.4em 0; border:0; border-top:1px solid var(--border); }
    .md-content img { max-width:100%; height:auto; border:1px solid var(--border); border-radius:8px; }
    .md-content table { display:block; width:100%; max-width:100%; overflow-x:auto; border-collapse:collapse; margin:1em 0; font-size:.82rem; }
    .md-content th,.md-content td { padding:8px 10px; border:1px solid var(--border); text-align:left; }
    .md-content th { background:#000; color:#fff; }
    .error-state { padding:22px 8px; text-align:center; color:#bbb; }
    .error-state p { overflow-wrap:anywhere; }
    .loading { padding:28px 10px; text-align:center; color:var(--muted); }
    @media (max-width:600px) {
      html { font-size:14px; }
      body { padding:7px; }
      .app { padding:13px 10px; border-radius:13px; }
      .header { align-items:flex-start; flex-direction:column; gap:10px; margin-bottom:15px; padding-bottom:13px; }
      .stats { gap:14px; }
      .search-wrap { gap:7px; }
      .search-wrap input { padding:11px 12px; font-size:.8rem; }
      .search-wrap button { padding:10px 13px; min-height:42px; }
      .file-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
      .file-card { gap:7px; min-height:46px; padding:9px 8px; }
      .file-card .name { font-size:.72rem; }
      .badge { padding:2px 5px; font-size:.52rem; }
      .footer { gap:8px 14px; font-size:.64rem; }
      .footer .rule { display:none; }
      .modal-overlay { padding:7px; }
      .modal { max-height:96dvh; border-radius:12px; }
      .modal-header { padding:9px 10px; gap:6px; }
      .modal-title { gap:6px; font-size:.76rem; }
      .actions { gap:5px; }
      .actions a { padding:6px 8px; font-size:.65rem; }
      .modal-close { width:32px; height:32px; }
      .modal-body { padding:14px 12px; }
      .md-content { font-size:.8rem; }
      .md-content h1 { font-size:1.25rem; }
      .md-content h2 { font-size:1.08rem; }
      .md-content h3 { font-size:.98rem; }
      .md-content pre { padding:10px; }
    }
    @media (max-width:360px) {
      .file-grid { grid-template-columns:1fr; }
      .search-wrap { flex-direction:column; }
      .search-wrap button { width:100%; }
      .modal-title .name { max-width:42vw; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <h1>CyberESP32LoRa</h1>
        <div class="sub">
          <span>ESP32 · LoRa · Wi-Fi · BLE</span>
          <span aria-hidden="true">—</span>
          <a href="https://github.com/HumayunShariarHimu" target="_blank" rel="noopener noreferrer">Humayun Shariar Himu</a>
        </div>
      </div>
      <div class="stats">
        <span><span id="fileCount" class="num">0</span> documents</span>
        <a href="https://github.com/HumayunShariarHimu/CyberESP32LoRa" target="_blank" rel="noopener noreferrer" class="gh-link">GitHub &rarr;</a>
      </div>
    </header>

    <form class="search-wrap" id="searchForm" role="search">
      <label for="searchInput" class="sr-only">Search documents and content</label>
      <input type="search" id="searchInput" placeholder="Search files and content..." autocomplete="off">
      <button type="submit" id="searchBtn">Search</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite">Loading repository documents...</p>
    <section class="file-grid" id="fileGrid" role="list" aria-label="Document list"></section>

    <footer class="footer">
      <a href="https://github.com/HumayunShariarHimu/CyberESP32LoRa" target="_blank" rel="noopener noreferrer">Repository</a>
      <a href="https://marked.js.org/" target="_blank" rel="noopener noreferrer">Marked.js</a>
    </footer>
  </main>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <section class="modal">
      <header class="modal-header">
        <div class="modal-title" id="modalTitle">
          <span class="doc-mark" id="modalIcon" aria-hidden="true">MD</span>
          <span class="name" id="modalFileName">Document</span>
        </div>
        <div class="actions">
          <a href="#" id="modalRawLink" target="_blank" rel="noopener noreferrer">Raw</a>
          <button type="button" class="modal-close" id="modalClose" aria-label="Close document">×</button>
        </div>
      </header>
      <div class="modal-body" id="modalBody">
        <div class="md-content" id="modalContent"><p class="loading">Loading document...</p></div>
      </div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      const REPO_OWNER = 'HumayunShariarHimu';
      const REPO_NAME = 'CyberESP32LoRa';
      const BRANCH = 'main';
      const API_BASE = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`;
      const RAW_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/`;

      const grid = document.getElementById('fileGrid');
      const searchInput = document.getElementById('searchInput');
      const searchForm = document.getElementById('searchForm');
      const fileCount = document.getElementById('fileCount');
      const status = document.getElementById('status');
      const overlay = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      const modalContent = document.getElementById('modalContent');
      const modalFileName = document.getElementById('modalFileName');
      const modalIcon = document.getElementById('modalIcon');
      const modalRawLink = document.getElementById('modalRawLink');
      const modalClose = document.getElementById('modalClose');

      let allDocs = [];
      let activeDoc = null;
      let previousFocus = null;
      let abortController = null;

      function safeText(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = value;
        return node;
      }

      async function fetchAllMarkdownFiles() {
        const url = `${API_BASE}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
        const response = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) {
          if (response.status === 403 || response.status === 429) {
            throw new Error('GitHub API rate limit reached. Please wait a moment and retry.');
          }
          if (response.status === 404) throw new Error('Repository or main branch was not found.');
          throw new Error(`GitHub API request failed (HTTP ${response.status}).`);
        }
        const data = await response.json();
        if (data.truncated) console.warn('GitHub returned a truncated repository tree.');
        return (data.tree || [])
          .filter(item => item.type === 'blob' && item.path.toLowerCase().endsWith('.md'))
          .map(item => ({
            name: item.path.split('/').pop(),
            path: item.path,
            url: RAW_BASE + item.path.split('/').map(encodeURIComponent).join('/')
          }))
          .sort((a, b) => {
            if (a.name.toLowerCase() === 'readme.md') return -1;
            if (b.name.toLowerCase() === 'readme.md') return 1;
            return a.path.localeCompare(b.path);
          });
      }

      async function fetchContent(doc) {
        try {
          const response = await fetch(doc.url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return { ...doc, content: await response.text(), error: false };
        } catch (error) {
          return { ...doc, content: `Unable to load this document (${error.message}). Open the raw file or try again.`, error: true };
        }
      }

      async function loadAllDocs() {
        const files = await fetchAllMarkdownFiles();
        if (!files.length) throw new Error('No Markdown (.md) documents were found in the main branch.');
        // Limit concurrent requests to avoid sending a large burst to GitHub.
        const results = [];
        const batchSize = 6;
        for (let i = 0; i < files.length; i += batchSize) {
          const batch = await Promise.all(files.slice(i, i + batchSize).map(fetchContent));
          results.push(...batch);
        }
        return results;
      }

      function renderGrid(docs) {
        grid.replaceChildren();
        fileCount.textContent = String(docs.length);
        if (!docs.length) {
          const empty = safeText('div', 'empty-grid', 'No documents match your search.');
          grid.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        docs.forEach(doc => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'file-card';
          card.setAttribute('role', 'listitem');
          card.setAttribute('aria-label', `Open ${doc.path}`);
          const isReadme = doc.name.toLowerCase() === 'readme.md';
          card.appendChild(safeText('span', 'doc-mark', isReadme ? 'README' : 'MD'));
          card.appendChild(safeText('span', 'name', doc.path.replace(/\.md$/i, '')));
          const badge = safeText('span', `badge${isReadme ? ' readme' : ''}`, isReadme ? 'README' : 'MD');
          card.appendChild(badge);
          card.addEventListener('click', () => openModal(doc));
          fragment.appendChild(card);
        });
        grid.appendChild(fragment);
      }

      function renderMarkdown(source) {
        if (!window.marked || typeof window.marked.parse !== 'function') {
          modalContent.textContent = source;
          return;
        }
        // Escape raw HTML from repository Markdown before parsing to prevent injected HTML.
        const escaped = source.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const rendered = window.marked.parse(escaped, { gfm: true, breaks: false });
        const template = document.createElement('template');
        template.innerHTML = rendered;
        template.content.querySelectorAll('script,style,iframe,object,embed,form,input,button,video,audio').forEach(el => el.remove());
        template.content.querySelectorAll('*').forEach(el => {
          [...el.attributes].forEach(attr => {
            if (attr.name.toLowerCase().startsWith('on')) el.removeAttribute(attr.name);
            if ((attr.name === 'href' || attr.name === 'src') && /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
          });
        });
        modalContent.replaceChildren(template.content);
        modalContent.querySelectorAll('a').forEach(link => {
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        });
      }

      function openModal(doc) {
        activeDoc = doc;
        previousFocus = document.activeElement;
        modalIcon.textContent = doc.name.toLowerCase() === 'readme.md' ? 'README' : 'MD';
        modalFileName.textContent = doc.path;
        modalRawLink.href = doc.url;
        modalContent.replaceChildren();

        if (doc.error) {
          const box = safeText('div', 'error-state', '');
          box.appendChild(safeText('p', '', doc.content));
          const link = safeText('a', '', 'Open raw document');
          link.href = doc.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          box.appendChild(link);
          modalContent.appendChild(box);
        } else {
          try {
            renderMarkdown(doc.content);
          } catch (error) {
            modalContent.textContent = `Markdown rendering failed: ${error.message}\n\n${doc.content}`;
          }
        }

        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        modalClose.focus();
      }

      function closeModal() {
        if (!overlay.classList.contains('open')) return;
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        activeDoc = null;
        if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
      }

      modalClose.addEventListener('click', closeModal);
      overlay.addEventListener('click', event => {
        if (event.target === overlay) closeModal();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeModal();
        if (event.key === 'Tab' && overlay.classList.contains('open')) {
          const focusable = overlay.querySelectorAll('a[href],button:not([disabled])');
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault(); last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault(); first.focus();
          }
        }
      });

      function performSearch(query) {
        const q = query.trim().toLocaleLowerCase();
        if (!q) {
          renderGrid(allDocs);
          status.textContent = `${allDocs.length} Markdown document(s) loaded.`;
          return;
        }
        const filtered = allDocs.filter(doc =>
          doc.name.toLocaleLowerCase().includes(q) ||
          doc.path.toLocaleLowerCase().includes(q) ||
          (doc.content && doc.content.toLocaleLowerCase().includes(q))
        );
        renderGrid(filtered);
        status.textContent = `${filtered.length} of ${allDocs.length} document(s) match "${query.trim()}".`;
      }

      searchForm.addEventListener('submit', event => {
        event.preventDefault();
        performSearch(searchInput.value);
      });
      searchInput.addEventListener('input', () => performSearch(searchInput.value));

      async function init() {
        grid.replaceChildren(safeText('div', 'empty-grid', 'Loading documents...'));
        status.textContent = 'Connecting to GitHub...';
        try {
          allDocs = await loadAllDocs();
          renderGrid(allDocs);
          const failed = allDocs.filter(doc => doc.error).length;
          status.textContent = failed
            ? `${allDocs.length} document(s) found; ${failed} could not be loaded.`
            : `${allDocs.length} Markdown document(s) loaded.`;
        } catch (error) {
          grid.replaceChildren();
          const box = safeText('div', 'empty-grid', '');
          box.appendChild(safeText('strong', '', 'Unable to load repository data'));
          box.appendChild(safeText('p', '', error.message));
          const link = safeText('a', '', 'Open repository on GitHub');
          link.href = `https://github.com/${REPO_OWNER}/${REPO_NAME}`;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.style.display = 'inline-block';
          link.style.marginTop = '12px';
          box.appendChild(link);
          grid.appendChild(box);
          fileCount.textContent = '0';
          status.textContent = 'Could not connect to GitHub. Check your connection and retry.';
          console.error('Repository load failed:', error);
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'secondary-btn';
          retry.textContent = 'Retry';
          retry.style.display = 'block';
          retry.style.margin = '12px auto';
          retry.addEventListener('click', init);
          grid.appendChild(retry);
        }
      }

      init();
    })();
  </script>
  <style>
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</body>
</html>
